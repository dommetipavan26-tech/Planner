<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Announce that JavaScript ran, before first paint. Scroll reveals stay
      // visible in the prerendered HTML until this class lands, so a crawler — or
      // a traveller whose connection never delivers the bundle — can read the
      // page. React hydrates #root, not <html>, so this never mismatches.
      document.documentElement.classList.add('js');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UtsavAir" />
    <meta name="twitter:card" content="summary" />

    <!-- Route-dependent metadata. scripts/prerender.tsx replaces this whole
         region per page, so a corridor URL is shared and indexed as itself
         rather than as the board. What sits between the markers is the default
         for a client-only render, where nothing replaces it. -->
    <!--utsavair:meta-->
    <title>UtsavAir — Festival corridor desk</title>
    <meta
      name="description"
      content="Festival fares run 2.48x to 3.78x off-season. UtsavAir pools travellers into contracted airline and coach blocks — cross a tier threshold and every pledged seat reprices down."
    />
    <meta property="og:title" content="UtsavAir — festival corridor desk" />
    <meta
      property="og:description"
      content="Pooled group allotment for Sankranti, Ugadi and wedding-peak travel out of Andhra Pradesh. Live tier slabs, disclosed platform fee, nothing charged until a block confirms."
    />
    <!--/utsavair:meta-->
    <meta name="theme-color" content="#06080E" />
    <meta name="color-scheme" content="dark" />

    <!-- Installable, not offline. There is deliberately no service worker: a
         cache in front of this ledger would be able to serve a stale seat count
         or a stale fare, which is the one thing this product must not do. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UtsavAir" />
    <meta name="format-detection" content="telephone=no" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080E'/%3E%3Cpath d='M8.5 22.5C14 21 18.5 17 23.5 9' stroke='%23E8A33D' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='8.5' cy='22.5' r='2.6' fill='%23F4F1EA'/%3E%3Ccircle cx='23.5' cy='9' r='2.6' fill='%23E8A33D'/%3E%3C/svg%3E"
    />

    <!-- Ledger lives in ap-south-1; warm the connection before first paint -->
    <link rel="preconnect" href="https://txbgovhxqxvlioszevbe.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://txbgovhxqxvlioszevbe.supabase.co" />

    <!--utsavair:head-->
    <style>
      /* First-paint shell so there is never a white flash before hydration.
         This block paints before the bundled stylesheet exists, so it cannot
         read the design system's custom properties and mirrors four tokens by
         value instead: --color-night, --color-ivory, --color-mist-faint and
         --color-marigold. Change one there, change it here. */
      html,
      body {
        margin: 0;
        background: #06080e; /* --color-night */
        color: #f4f1ea; /* --color-ivory */
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7c8392; /* --color-mist-faint */
      }
      #boot span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #e8a33d; /* --color-marigold */
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      #boot span:nth-child(2) {
        animation-delay: 0.18s;
      }
      #boot span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--utsavair:app-->
      <div id="boot" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
