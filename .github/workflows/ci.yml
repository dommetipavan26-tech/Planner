name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · render checks · build · accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # strict, noUncheckedIndexedAccess, verbatimModuleSyntax, noUnusedLocals
      - name: Typecheck
        run: npm run typecheck

      # Renders every view in Node with no DOM and asserts 101 properties:
      # no NaN or bare undefined reaching the reader, no phone number in the
      # public feed, internal consistency of every snapshot corridor, one h1 and
      # no skipped heading level in any view, route titles and descriptions
      # shaped for a search result, and the same tree rendering byte-identically
      # twice — which is what makes the prerender safe to hydrate.
      # Needs no network and no Supabase credentials — it reads the snapshot.
      - name: Render checks
        run: npm run verify

      # Builds the client bundle, then writes all 12 routes to static HTML in
      # dist/ (scripts/prerender.tsx). A route that renders its error boundary,
      # loses the wordmark, or omits its own corridor code fails the build here
      # rather than shipping an empty shell that looks prerendered.
      - name: Production build and prerender
        run: npm run build

      # axe-core over the documents that actually ship, plus assertions axe
      # cannot make in jsdom: one h1 per page, a skip link that lands somewhere
      # real, a canonical URL matching the file it sits in, no literal colour in
      # inline styles, the hydration guard naming the right route, and a sitemap
      # that lists exactly the routes the router produces.
      # colour-contrast is off because jsdom has no layout engine to resolve the
      # cascade; contrast is gated by the design-token audit instead.
      - name: Accessibility and document gate
        run: npm run audit

      # Mirrors vite.config.ts chunkSizeWarningLimit: 260. Vite only warns, so
      # the budget is enforced here instead of left to a reader noticing.
      - name: Bundle budget
        run: |
          node -e '
            const fs = require("fs");
            const dir = "dist/assets";
            const limit = 260 * 1024;
            const over = fs.readdirSync(dir)
              .filter((f) => /\.(js|css)$/.test(f))
              .map((f) => ({ f, kb: fs.statSync(dir + "/" + f).size / 1024 }))
              .filter((a) => a.kb * 1024 > limit);
            if (over.length) {
              for (const a of over) console.error(`over budget: ${a.f} ${a.kb.toFixed(2)} kB`);
              process.exit(1);
            }
            console.log("every js/css chunk is within the 260 kB budget");
          '

      # The design system's central claim: every hue lives in src/index.css.
      # The leading [^/[:alnum:]] keeps the rule honest about what a colour
      # literal looks like — a '#', quote, '(' or space before the hex — so a
      # URL fragment such as href="/#fee" is not a false positive, while an
      # arbitrary Tailwind value, an inline style and rgba() all are.
      - name: No literal colours outside the design system
        run: |
          if grep -rEn '[^/[:alnum:]]#[0-9a-fA-F]{3,8}\b|rgba?\(' src --include='*.tsx' --include='*.ts'; then
            echo 'A component carries a literal colour. Promote it to a token in src/index.css.'
            exit 1
          fi
          echo 'no literal colours in src/**'

      # Nothing above this line depends on the lockfile being free of known-vulnerable
      # packages, and a green build says nothing about it. --omit=dev is the scope
      # that matters: it is what ships to a browser. The dev tree is audited in the
      # same step and reported, but only the production scope can fail the build.
      - name: Dependency audit
        run: |
          echo '--- production dependencies (must be clean) ---'
          npm audit --omit=dev --audit-level=high
          echo '--- full tree, reported not enforced ---'
          npm audit --audit-level=high || true

  browser:
    name: Browser smoke · contrast · Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The browser binaries are the reason this is its own job: they are a
      # few hundred MB, and the Node job above should not pay for them.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build and prerender
        run: npm run build

      # Real navigation, real hydration, the ledger cut at the network layer, and
      # axe-core with colour-contrast enabled — the one WCAG rule the jsdom audit
      # in the job above has to skip, because contrast needs a layout engine.
      # The ledger is stubbed, so this never writes to the production project.
      - name: Browser smoke tests
        run: npx playwright test

      # Workflow logs live on a blob host that is not reachable from every
      # collaborator, and GitHub surfaces only the first annotations of a step,
      # so a 27-failure run can hide the interesting one. Re-running just the
      # document spec after a failure puts its error text — and only its error
      # text — into that step's annotations, where the pull request page shows
      # it. Costs a minute, and only ever runs when the gate is already red.
      - name: Surface document test failures
        if: failure()
        run: npx playwright test tests/documents.spec.ts --retries=0

      # Lighthouse is fetched at run time rather than added to the lockfile. Its
      # dependency tree (lighthouse → puppeteer-core → extract-zip, basic-ftp,
      # tmp) currently carries nine high-severity advisories with no fixed release
      # in the 0.15 line, and none of it belongs in a browser. Pinning the exact
      # version here keeps that out of `npm ci` while still failing the build on a
      # budget regression. It reuses the Chromium Playwright just installed.
      # Three runs per URL rather than one. `lhci assert` judges the median, and
      # the budgets here include single-sample timings — FCP 2500ms, server
      # response 600ms, CLS 0.1 — which on a shared runner are noisy enough that
      # one sample reddens a build at random. It did: PR #7's first run failed this
      # step, wrote no reports at all, and the next run passed the same code. The
      # step below exists to tell those two situations apart; this one exists to
      # make the first one rarer.
      - name: Lighthouse budgets
        run: |
          echo "CHROME_PATH=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
          npx --yes @lhci/cli@0.16.1 autorun
          # Record the scores on the way past, not only when something breaks: a
          # green run that leaves no numbers behind is a green run nobody can
          # compare the next one to. And say out loud when lhci kept no local
          # reports, because the upload step below has been reporting success
          # while uploading nothing at all.
          if [ -d .lighthouseci ]; then
            node scripts/lhci-report.mjs
          else
            echo "::warning::lhci wrote no .lighthouseci directory, so no scores can be recorded here and the report artifact will be empty"
          fi

      # A Lighthouse failure has to be readable from outside the runner: job logs
      # are not always retrievable, and the artifact below is empty when lhci dies
      # before it writes anything — which is exactly the case that looks like a
      # budget regression and is not one. So on failure this says which of the two
      # happened, and emits the specifics as annotations, where they can be read
      # back through the API.
      # A Lighthouse failure has to be readable from outside the runner: job logs
      # are not always retrievable, and the artifact below is empty when lhci dies
      # before it collects anything — so "a budget regressed" and "Lighthouse never
      # ran" look identical in the checks list while needing opposite responses.
      # The script says which one happened, and re-judges any reports that do exist
      # against the budgets in .lighthouserc.json.
      - name: Surface Lighthouse failures
        if: failure()
        run: node scripts/lhci-report.mjs

      - name: Upload browser and Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-and-lighthouse-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
          # `ignore` let this step report success while uploading nothing, which
          # is how an empty artifact came to look like a normal outcome rather
          # than evidence that there was nothing to keep.
          if-no-files-found: warn
