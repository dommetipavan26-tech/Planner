name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · render checks · build · accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # strict, noUncheckedIndexedAccess, verbatimModuleSyntax, noUnusedLocals
      - name: Typecheck
        run: npm run typecheck

      # Renders every view in Node with no DOM and asserts 87 properties:
      # no NaN or bare undefined reaching the reader, no phone number in the
      # public feed, internal consistency of every snapshot corridor, one h1 and
      # no skipped heading level in any view, route titles and descriptions
      # shaped for a search result, and the same tree rendering byte-identically
      # twice — which is what makes the prerender safe to hydrate.
      # Needs no network and no Supabase credentials — it reads the snapshot.
      - name: Render checks
        run: npm run verify

      # Builds the client bundle, then writes all 12 routes to static HTML in
      # dist/ (scripts/prerender.tsx). A route that renders its error boundary,
      # loses the wordmark, or omits its own corridor code fails the build here
      # rather than shipping an empty shell that looks prerendered.
      - name: Production build and prerender
        run: npm run build

      # axe-core over the documents that actually ship, plus assertions axe
      # cannot make in jsdom: one h1 per page, a skip link that lands somewhere
      # real, a canonical URL matching the file it sits in, no literal colour in
      # inline styles, the hydration guard naming the right route, and a sitemap
      # that lists exactly the routes the router produces.
      # colour-contrast is off because jsdom has no layout engine to resolve the
      # cascade; contrast is gated by the design-token audit instead.
      - name: Accessibility and document gate
        run: npm run audit

      # Mirrors vite.config.ts chunkSizeWarningLimit: 260. Vite only warns, so
      # the budget is enforced here instead of left to a reader noticing.
      - name: Bundle budget
        run: |
          node -e '
            const fs = require("fs");
            const dir = "dist/assets";
            const limit = 260 * 1024;
            const over = fs.readdirSync(dir)
              .filter((f) => /\.(js|css)$/.test(f))
              .map((f) => ({ f, kb: fs.statSync(dir + "/" + f).size / 1024 }))
              .filter((a) => a.kb * 1024 > limit);
            if (over.length) {
              for (const a of over) console.error(`over budget: ${a.f} ${a.kb.toFixed(2)} kB`);
              process.exit(1);
            }
            console.log("every js/css chunk is within the 260 kB budget");
          '

      # The design system's central claim: every hue lives in src/index.css.
      # The leading [^/[:alnum:]] keeps the rule honest about what a colour
      # literal looks like — a '#', quote, '(' or space before the hex — so a
      # URL fragment such as href="/#fee" is not a false positive, while an
      # arbitrary Tailwind value, an inline style and rgba() all are.
      - name: No literal colours outside the design system
        run: |
          if grep -rEn '[^/[:alnum:]]#[0-9a-fA-F]{3,8}\b|rgba?\(' src --include='*.tsx' --include='*.ts'; then
            echo 'A component carries a literal colour. Promote it to a token in src/index.css.'
            exit 1
          fi
          echo 'no literal colours in src/**'
